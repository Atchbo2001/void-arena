name: Build Void Arena for Pterodactyl

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: void-arena-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pterodactyl:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ASSET_MAPS: "complex turbine dust2 academy metl3 metl4 frostbyte gorge hades injustice lostinspace oasis paradigm phosgene ruby stronghold suburb forge reissen venice"
      ASSET_FFA_MAPS: "complex turbine dust2 academy metl3 metl4 frostbyte gorge hades injustice lostinspace oasis paradigm phosgene ruby stronghold suburb"
      ASSET_CAPTURE_MAPS: "dust2 forge frostbyte gorge hades lostinspace paradigm reissen ruby stronghold suburb venice"
      ASSET_CTF_MAPS: "dust2 forge reissen stronghold suburb"

    steps:
      - name: Check out the full source fork
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Fetch Git LFS game assets
        run: |
          git lfs install
          git lfs pull

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            cache
            .emscripten-cache
          key: void-arena-${{ runner.os }}-${{ hashFiles('docker/emscripten.Dockerfile', 'game/**', 'assets/**', 'client/yarn.lock') }}
          restore-keys: |
            void-arena-${{ runner.os }}-

      - name: Prepare source build scripts
        run: |
          chmod +x scripts/*
          chmod +x game/build assets/setup assets/ci 2>/dev/null || true
          docker version

      - name: Build the pinned Sour toolchain image
        run: ./scripts/build-builder-image

      - name: Build the bundled ENet library
        run: |
          make -C pkg/enet/enet clean
          make -C pkg/enet/enet

      - name: Build and verify curated game maps
        run: ./scripts/build assets

      - name: Verify map manifest and server rotations
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("assets/dist/packaged-maps.json").read_text())
          packaged = manifest["maps"]
          if len(packaged) != 20:
              raise SystemExit(f"expected exactly 20 packaged maps, got {len(packaged)}")
          if len(packaged) != len(set(packaged)):
              raise SystemExit("packaged map manifest contains duplicates")

          # Validate only actual map fields. A quoted list item consisting solely
          # of a Sauerbraten-style identifier is a map rotation entry; asset URLs
          # and mapping entries such as '- preset:' cannot match this pattern.
          referenced = set()
          for line in Path("pterodactyl.yaml").read_text().splitlines():
              default_match = re.fullmatch(r'\s*defaultMap:\s*"([a-z0-9_-]+)"\s*', line)
              if default_match:
                  referenced.add(default_match.group(1))
              list_match = re.fullmatch(r'\s*-\s*"([a-z0-9_-]+)"\s*', line)
              if list_match:
                  referenced.add(list_match.group(1))

          missing = sorted(referenced - set(packaged))
          if missing:
              raise SystemExit("server configuration references unpackaged maps: " + ", ".join(missing))

          expected_categories = {
              "ffa": 17,
              "capture": 12,
              "ctf": 5,
          }
          for category, expected in expected_categories.items():
              actual = len(manifest[category])
              if actual != expected:
                  raise SystemExit(f"expected {expected} {category} maps, got {actual}")

          print(f"verified {len(packaged)} real packaged maps and {len(referenced)} configured map references")
          PY

      - name: Build WebAssembly game engine
        run: ./scripts/build game

      - name: Build web client
        run: ./scripts/build web

      - name: Set up Go for multiplayer regression tests
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run multiplayer protocol and relay regressions
        run: |
          go test ./pkg/gameserver/relay -count=20
          go test ./pkg/game/protocol -run TestBotPositionUsesUnsignedClientNumber -count=20

      - name: Build Go multiplayer backend
        run: ./scripts/build server

      - name: Verify the Linux server binary
        run: |
          test -x bin/sour
          test -f assets/dist/.index.source
          test -f assets/dist/packaged-maps.json
          test -f pkg/server/static/site/index.html
          file bin/sour
          ldd bin/sour || true
          ./bin/sour --version

      - name: Smoke-test the integrated HTTP and WebSocket server
        run: |
          set -euo pipefail
          mkdir -p .cache/assets
          ./bin/sour serve --address 127.0.0.1 --port 18080 pterodactyl.yaml > /tmp/void-arena.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/void-arena.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != 1 ]]; then
            cat /tmp/void-arena.log
            exit 1
          fi

          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
          cat /tmp/void-arena.log

      - name: Assemble the flat Pterodactyl upload package
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/void-arena/bin release/void-arena/assets

          cp bin/sour release/void-arena/bin/sour
          cp -a assets/dist release/void-arena/assets/dist
          cp start.sh package.json pterodactyl.yaml PTERODACTYL.md MAPS.md LICENSE release/void-arena/
          chmod +x release/void-arena/bin/sour release/void-arena/start.sh

          (
            cd release/void-arena
            sha256sum bin/sour > SHA256SUMS.txt
            find assets/dist -type f -print0 | sort -z | xargs -0 sha256sum >> SHA256SUMS.txt
          )

          (
            cd release/void-arena
            zip -r -9 ../void-arena-pterodactyl.zip .
          )

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: void-arena-pterodactyl-${{ github.sha }}
          path: release/void-arena-pterodactyl.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
